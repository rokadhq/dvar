name: Release (held until v1)

# Accepted product decision, 2026-10-15: no public release before all 55 v1
# capabilities and qualification gates are complete and explicitly approved.
# Restoring publication requires a reviewed change. No registry credentials,
# npm environment, npm publish command or OIDC write permission exists here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Publication is suspended
        run: |
          echo '::error::Dvar publication is on hold. Complete all 55 v1 acceptance gates and obtain release sign-off before restoring publishing.'
          exit 1
